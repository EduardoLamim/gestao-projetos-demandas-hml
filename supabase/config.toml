# HML configuration. Hosted changes require an explicit remote target and reviewed diff.
project_id = "gestao-projetos-demandas-hml"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[realtime]
enabled = false
[storage]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = false
port = 54324
[auth]
enabled = true
site_url = "https://eduardolamim.github.io/gestao-projetos-demandas-hml/"
additional_redirect_urls = ["http://127.0.0.1:4173/gestao-projetos-demandas-hml/"]
jwt_expiry = 900
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
minimum_password_length = 12
[auth.email]
enabled = true
enable_confirmations = true
[analytics]
enabled = false

[functions.create-user]
verify_jwt = false # Handler validates JWT with Auth and active admin profile before privileged actions.
